name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The end-to-end tests only build with their tag; vet them here too so
      # they cannot rot between the runs of the e2e job.
      - name: Vet (e2e tests)
        run: go vet -tags e2e ./...

      - name: Test
        run: go test -race ./...

      # The deployment image builds with CGO disabled so bun's sqliteshim
      # selects the pure-Go sqlite backend. Building that way here catches a
      # cgo-only dependency before it reaches the registry.
      - name: Build (CGO disabled, as the image does)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

  # The LiteLLM client against a real gateway: the one the dev stack runs,
  # from the same compose file, so a Dependabot bump of the image is tested
  # here before it is merged.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start LiteLLM
        run: docker compose -f dev/docker-compose.yml up -d --wait litellm

      - name: Test
        run: go test -tags e2e -race ./internal/litellm/

      - name: Show LiteLLM logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs litellm

  # The image is only published from main and tags, so a broken Dockerfile
  # (e.g. go.mod requiring a newer Go than the builder image) would otherwise
  # only surface after merge.
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
