name: CI

# Branches are tested through their pull request. Testing every push as well
# would run everything twice for a branch with an open pull request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The steps are the Makefile's, so `make check` locally runs the same.
      - name: Verify formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      # The deployment image builds with CGO disabled so bun's sqliteshim
      # selects the pure-Go sqlite backend.
      - name: Build (CGO disabled, as the image does)
        run: make build

  # The LiteLLM client against a real gateway: the one the dev stack runs,
  # from the same compose file, so a Dependabot bump of the image is tested
  # here before it is merged.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Only LiteLLM: the tests need nothing else from the stack.
      - name: Test
        run: make e2e SERVICES=litellm

      - name: Show LiteLLM logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs litellm

  # The pages in Chromium, against an instance the tests seed on the dev
  # stack's OIDC mock and LiteLLM.
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The driver and Chromium follow the playwright-go version in go.sum.
      - name: Cache Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # --with-deps also installs Chromium's system libraries, from apt.
      - name: Install Playwright
        run: make browser-install PLAYWRIGHT_FLAGS=--with-deps

      - name: Test
        run: make browser SERVICES="litellm oidc-mock"

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces
          path: internal/browsertest/testdata/traces/
          if-no-files-found: ignore

      - name: Show the stack's logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs litellm oidc-mock

  # The image is only published from main and tags, so a broken Dockerfile
  # (e.g. go.mod requiring a newer Go than the builder image) would otherwise
  # only surface after merge.
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
