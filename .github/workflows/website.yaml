name: Website

# The website and documentation (docs/, built with Zensical) are published
# on GitHub Pages from main, and only from main: there is no manual trigger,
# which could deploy another branch. Pull requests are built by
# website-check.yaml, which has no deploy job that would show up there as
# skipped. Settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - web/static/fonts/**
      - web/static/favicon.*
      - web/static/apple-touch-icon.png
      - .github/workflows/website.yaml
      - Makefile

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling a running
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      # The Makefile installs the pinned Zensical from docs/requirements.txt
      # into docs/.venv, copies in the brand files and builds with --strict,
      # so a broken link fails the job. No pip cache: Zensical advises against
      # caching on CI for now.
      - name: Build the site
        run: make website

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
