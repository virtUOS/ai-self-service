version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      # Bundle routine bumps into one PR; major versions still arrive alone.
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images of the published container (golang build stage, distroless runtime).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # Images of the local development stack (mock OIDC, Keycloak, LiteLLM and its
  # Postgres, Mailpit). The CI e2e job runs against this LiteLLM, so each bump
  # is tested before it is merged.
  - package-ecosystem: docker-compose
    directory: /dev
    schedule:
      interval: monthly
    groups:
      dev-stack:
        patterns: ["*"]
