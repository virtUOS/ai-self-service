# Two OIDC providers for local development; pick one.
#
#   docker compose -f dev/docker-compose.yml up -d              # Keycloak
#   docker compose -f dev/docker-compose.yml --profile mock up -d  # mock
#
# Keycloak is the same software the university runs, so it is what to use when
# touching anything auth-shaped. The mock starts in about a second and needs no
# realm import, which suits everyday iteration — but it serves no back-channel
# logout, so it cannot exercise that path. See dev/README.md.
#
# Admin console: http://localhost:8081  (admin / admin)
# Realm, client and two test users are imported from realm-export.json.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/virtuos HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Fast alternative to Keycloak. Under a compose profile so it only starts
  # when asked for, leaving the default `up` behaviour unchanged.
  #
  # It accepts any client id and secret without registration, so no client
  # config is needed: log in as either user below by entering their subject.
  oidc-mock:
    profiles: ["mock"]
    image: ghcr.io/astral-sh/uv:python3.14-bookworm
    command:
      - sh
      - -c
      - >-
        uvx --from oidc-provider-mock==0.4.6 python -m oidc_provider_mock
        --host 0.0.0.0 --port 8081
        --user-claims-file /users.json
    ports:
      - "8081:8081"
    volumes:
      - ./mock-users.json:/users.json:ro
    # Checked with python, not the /dev/tcp trick the Keycloak service uses:
    # this image's sh is dash, which has no /dev/tcp.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/.well-known/openid-configuration").read()
      interval: 2s
      timeout: 5s
      retries: 30
