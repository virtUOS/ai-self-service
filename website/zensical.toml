# The Keyosk website and documentation, built with Zensical:
#   make website         build into website/site
#   make website-serve   build and serve with live reload
# The brand files (fonts, logos, favicon) are copied from web/static and
# docs/brand into docs/assets by `make website-assets`; they are not committed
# here.

[project]
site_name = "Keyosk"
site_description = "Keyosk is your self-service counter for local AI: log in and get your LiteLLM API key in seconds."
site_url = "https://virtuos.github.io/keyosk/"
copyright = "Copyright &copy; 2026 virtUOS, Osnabrück University"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
]

[project.theme]
language = "en"
# The fonts are self-hosted, see stylesheets/extra.css.
font = false
custom_dir = "overrides"
favicon = "assets/favicon.ico"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "keyosk"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "keyosk-dark"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# No repo_url: with one, the header fetches the repository's version and star
# count from api.github.com in every visitor's browser. The link is a plain one.
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/virtUOS/keyosk"
name = "Keyosk on GitHub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
tables = {}
